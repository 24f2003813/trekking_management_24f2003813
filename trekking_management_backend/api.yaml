  /api/trekker/treks/{trek_id}/book:
    post:
      tags:
        - Trekker
      summary: Book a trek
      description: Allows an authenticated trekker to book an available trek.

      operationId: bookTrek

      security:
        - bearerAuth: []

      parameters:
        - name: trek_id
          in: path
          required: true
          description: ID of the trek to book.
          schema:
            type: integer
            example: 3

      responses:
        "201":
          description: Trek booked successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Trek booked successfully
                  booking_id:
                    type: integer
                    example: 25
                  notification:
                    type: string
                    example: Trek 'Everest Base Camp' booked by Rahul Sharma

        "400":
          description: Invalid booking request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      trekUnavailable:
                        value: Trek not available for booking
                      alreadyBooked:
                        value: You have already booked this trek
                      noSlots:
                        value: No slots available

        "401":
          description: Unauthorized. JWT token is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Missing Authorization Header

        "403":
          description: Forbidden. Only trekkers can book treks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized

